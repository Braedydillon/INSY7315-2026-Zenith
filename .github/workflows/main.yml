name: Build and Test .NET Projects

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MVC dependencies
        run: dotnet restore Website/INSY7315_MVC_Prototype-master/INSY7315_Prototype/INSY7315_Prototype.csproj

      - name: Build MVC project
        run: dotnet build Website/INSY7315_MVC_Prototype-master/INSY7315_Prototype/INSY7315_Prototype.csproj --configuration Release --no-restore

      - name: Restore API dependencies
        run: dotnet restore Backend/Api/APIINSY7315/APIINSY7315.csproj

      - name: Build API project
        run: dotnet build Backend/Api/APIINSY7315/APIINSY7315.csproj --configuration Release --no-restore
